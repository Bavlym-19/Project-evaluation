<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XORDEN — Project Evaluation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Hanken+Grotesk:wght@200;300;400;500&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3efe6; --dim:rgba(243,239,230,.55); --line:rgba(243,239,230,.08);
    --gold:#c9a96e; --gold-hi:#f0dcae; --gold-lo:#8f7240;
    --ease:cubic-bezier(.16,1,.3,1);
    --serif:'Cormorant Garamond','Times New Roman',serif; --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mx:50vw; --my:50vh; --nx:0; --ny:0;
  }
  html[lang="ar"]{--serif:'Amiri','Times New Roman',serif;--sans:'Tajawal','Segoe UI',Tahoma,sans-serif}
  html[lang="ar"] *{letter-spacing:0!important}
  html[lang="ar"] .serif,html[lang="ar"] h2 em,html[lang="ar"] .score b{font-style:normal}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#000;color:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  :focus-visible{outline:1px solid var(--gold);outline-offset:4px}
  .micro{font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
  .dim{color:var(--dim)}
  .serif{font-family:var(--serif);font-style:italic;font-weight:300;color:var(--gold)}

  /* atmosphere */
  .grid-bg,.grid-hi{position:fixed;inset:0;pointer-events:none;background-size:8.3333vw 8.3333vw;background-position:center}
  .grid-bg{background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line) 1px,transparent 1px);
    -webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 85%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 85%)}
  .grid-hi{background-image:linear-gradient(to right,rgba(201,169,110,.28) 1px,transparent 1px),linear-gradient(to bottom,rgba(201,169,110,.28) 1px,transparent 1px);
    -webkit-mask-image:radial-gradient(circle 300px at var(--mx) var(--my),#000,transparent);mask-image:radial-gradient(circle 300px at var(--mx) var(--my),#000,transparent)}
  .spot{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle 560px at var(--mx) var(--my),rgba(201,169,110,.07),transparent 70%)}
  #dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  .frame{position:fixed;inset:2.2vh 1.4vw;border:1px solid rgba(201,169,110,.13);pointer-events:none;z-index:9}
  .frame i{position:absolute;width:16px;height:16px;border:1px solid var(--gold)}
  .frame i:nth-child(1){left:-1px;top:-1px;border-right:0;border-bottom:0}.frame i:nth-child(2){right:-1px;top:-1px;border-left:0;border-bottom:0}
  .frame i:nth-child(3){left:-1px;bottom:-1px;border-right:0;border-top:0}.frame i:nth-child(4){right:-1px;bottom:-1px;border-left:0;border-top:0}
  .prog{position:fixed;left:0;top:0;height:2px;width:0;z-index:30;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));transition:width 1.2s var(--ease)}

  /* screens */
  .scr{position:absolute;inset:0;z-index:2;display:flex;justify-content:center;padding:max(10vh,104px) 8vw 13vh;overflow-y:auto;
    opacity:0;visibility:hidden;clip-path:inset(0 0 100% 0);transform:translateY(var(--o,3vh));
    transition:opacity 1s var(--ease),transform 1.2s var(--ease),clip-path 1.3s var(--ease),visibility 0s 1.3s}
  [hidden]{display:none!important}
  .scr.after{clip-path:inset(100% 0 0 0)}.scr.before{clip-path:inset(0 0 100% 0)}
  .scr.active{opacity:1;visibility:visible;transform:none;clip-path:inset(0);transition:opacity 1s var(--ease),transform 1.2s var(--ease),clip-path 1.3s var(--ease),visibility 0s}
  .scr>.in{width:100%;max-width:1120px;margin:auto}
  [data-a]{opacity:0;transform:translateY(26px);filter:blur(8px);transition:opacity .5s var(--ease),transform .5s var(--ease),filter .5s var(--ease)}
  .scr.active [data-a]{opacity:1;transform:none;filter:none;transition:opacity 1.1s var(--ease) var(--d,0s),transform 1.3s var(--ease) var(--d,0s),filter 1.1s var(--ease) var(--d,0s)}
  .rule{height:1px;background:linear-gradient(90deg,var(--gold),rgba(201,169,110,.05));transform-origin:left;transform:scaleX(0);transition:transform .5s var(--ease)}
  .scr.active .rule{transform:scaleX(1);transition:transform 1.7s var(--ease) var(--d,.3s)}
  html[dir="rtl"] .rule{transform-origin:right;background:linear-gradient(270deg,var(--gold),rgba(201,169,110,.05))}
  h1,h2{font-family:var(--serif);font-weight:300;line-height:1;margin:0;letter-spacing:-.01em}
  h1{font-size:clamp(2.8rem,6.6vw,6rem)}h2{font-size:clamp(2.3rem,4.8vw,4.2rem)}
  h1 em,h2 em{font-style:italic;color:var(--gold)}
  .lead{font-weight:300;line-height:1.7;color:var(--dim);max-width:30rem}

  /* buttons */
  .btn{border:1px solid rgba(201,169,110,.5);background:none;color:var(--gold);padding:.95rem 1.9rem;font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;cursor:pointer;transition:all .5s var(--ease)}
  .btn:hover{background:rgba(201,169,110,.1);border-color:var(--gold)}
  .btn.primary{background:linear-gradient(135deg,#e0c88f,#a98a52);color:#0b0a08;border-color:transparent;font-weight:500}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.28;pointer-events:none}
  .btn.sm{padding:.7rem 1.2rem;font-size:.64rem}

  /* hero */
  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:4vw;align-items:center}
  .art{position:relative;width:min(34rem,86vw,66vh);aspect-ratio:1;justify-self:center}
  .px{position:absolute;inset:0;transform:translate(calc(var(--nx)*-14px),calc(var(--ny)*-10px));transition:transform .8s var(--ease)}
  .art img{position:relative;width:100%;height:100%;display:block;-webkit-mask-image:radial-gradient(closest-side,#000 64%,transparent 100%);mask-image:radial-gradient(closest-side,#000 64%,transparent 100%);animation:float 9s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .ring{position:absolute;border-radius:50%;border:1px solid rgba(201,169,110,.28)}
  .ring.r1{inset:7%;animation:spin 70s linear infinite}.ring.r2{inset:-3%;border-style:dashed;border-color:rgba(201,169,110,.15);animation:spin 120s linear infinite reverse}
  .ring.r1::after{content:"";position:absolute;left:50%;top:-3px;width:5px;height:5px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 12px var(--gold)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .team{margin-top:2rem;font-size:.8rem;color:var(--dim);letter-spacing:.06em}

  /* question screens */
  .qnum{position:absolute;inset-inline-end:3vw;bottom:-4vh;font-family:var(--serif);font-weight:300;line-height:.8;font-size:clamp(14rem,34vw,34rem);color:transparent;
    -webkit-text-stroke:1px rgba(201,169,110,.14);pointer-events:none;opacity:0;transform:translateY(8vh);transition:opacity 1.5s var(--ease),transform 1.7s var(--ease)}
  .scr.active .qnum{opacity:1;transform:none}
  .q{display:grid;grid-template-columns:1fr 1.1fr;gap:5vw;align-items:center;position:relative}
  .score{display:flex;align-items:baseline;gap:.6rem;margin-bottom:1.6rem;direction:ltr}
  .score b{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(5rem,9vw,8rem);line-height:.9;color:var(--gold);min-width:1.3ch;font-variant-numeric:tabular-nums}
  .score small{font-size:1.1rem;color:var(--dim)}
  .desc{margin-inline-start:1rem;font-family:var(--serif);font-style:italic;font-size:1.5rem;color:var(--paper);min-height:2rem}
  html[lang="ar"] .desc{font-style:normal}
  .meter{display:flex;gap:.55rem;align-items:flex-end;height:130px;direction:ltr;margin-bottom:3.2rem}
  .meter button{flex:1;height:calc(26px + var(--i)*9px);position:relative;border:0;border-top:1px solid rgba(243,239,230,.2);background:rgba(243,239,230,.06);cursor:pointer;padding:0;transition:background .4s var(--ease),transform .4s var(--ease)}
  .meter button span{position:absolute;bottom:-1.7rem;left:50%;transform:translateX(-50%);font-size:.72rem;color:var(--dim);transition:color .3s}
  .meter button.pv{background:rgba(201,169,110,.22)}
  .meter button.fill{background:linear-gradient(to top,rgba(201,169,110,.18),var(--gold));border-top-color:var(--gold-hi)}
  .meter button.fill span,.meter button.cur span{color:var(--gold-hi)}
  .meter button.cur{transform:translateY(-6px)}
  .note{width:100%;resize:none;background:none;border:0;border-bottom:1px solid var(--line);padding:.7rem 0;min-height:3.4rem;font-weight:300;font-size:.95rem;transition:border-color .5s var(--ease)}
  .note:focus{outline:none;border-color:var(--gold)}
  .note::placeholder{color:rgba(243,239,230,.3)}

  /* review */
  .rev{display:grid;grid-template-columns:.95fr 1.05fr;gap:5vw;align-items:start}
  .bigscore{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(5rem,9vw,8rem);line-height:.9;color:var(--gold);direction:ltr;display:inline-block}
  html[lang="ar"] .bigscore{font-style:normal}
  .grade{font-family:var(--serif);font-size:1.7rem;margin:.4rem 0 1.4rem}
  .radar{width:min(100%,360px);display:block;margin-inline:auto;direction:ltr;overflow:visible}
  .radar .g{fill:none;stroke:rgba(243,239,230,.1);stroke-width:1}
  .radar .ax{stroke:rgba(243,239,230,.1);stroke-width:1}
  .radar .poly{fill:rgba(201,169,110,.2);stroke:var(--gold);stroke-width:1.5;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(201,169,110,.35))}
  .radar circle.pt{fill:var(--gold-hi)}
  .radar text{fill:var(--dim);font-size:10.5px;font-family:var(--sans)}
  .rows{margin:1.4rem 0 0;padding:0;list-style:none}
  .rows li{display:grid;grid-template-columns:1fr auto;gap:.3rem 1rem;padding:.75rem 0;border-bottom:1px solid var(--line);font-weight:300}
  .rows li b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.25rem;color:var(--gold);direction:ltr}
  .rows .bar{grid-column:1/-1;height:2px;background:rgba(243,239,230,.07)}
  .rows .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));transition:width 1.6s var(--ease)}
  .field{display:block;margin-bottom:1.3rem}
  .field label{display:block;font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:.4rem}
  .field input,.field textarea{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:.6rem 0;font-weight:300;font-size:1.02rem;transition:border-color .5s var(--ease);resize:none}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
  .acts{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.6rem}
  .acts .row2{width:100%;display:flex;flex-wrap:wrap;gap:.6rem}
  .warn{color:#e7b27a;font-size:.85rem;margin-top:1rem;min-height:1.2rem}

  /* team */
  .tw{display:grid;grid-template-columns:.8fr 1.6fr;gap:4vw;align-items:start}
  .tlist{display:flex;flex-direction:column}
  .trow{display:grid;grid-template-columns:46px 1fr auto 2.8rem;gap:.35rem 1.1rem;align-items:center;padding:.85rem 0;border-bottom:1px solid var(--line)}
  .mono{width:46px;height:46px;border-radius:50%;border:1px solid rgba(201,169,110,.5);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;color:var(--gold);font-size:1.15rem;background:radial-gradient(circle at 30% 25%,rgba(201,169,110,.2),transparent 70%)}
  html[lang="ar"] .mono,html[lang="ar"] .ts{font-style:normal}
  .who b{display:block;font-family:var(--serif);font-weight:400;font-size:1.35rem;line-height:1.1}
  .who span{display:block;font-size:.78rem;color:var(--dim);margin-top:.25rem}
  .mm{display:flex;gap:4px;align-items:flex-end;height:36px;direction:ltr}
  .mm button{width:17px;height:calc(10px + var(--i)*2.6px);border:0;border-top:1px solid rgba(243,239,230,.2);background:rgba(243,239,230,.07);padding:0;cursor:pointer;transition:background .3s var(--ease)}
  .mm button.pv{background:rgba(201,169,110,.25)}
  .mm button.fill{background:linear-gradient(to top,rgba(201,169,110,.2),var(--gold));border-top-color:var(--gold-hi)}
  .ts{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:1.6rem;text-align:center;direction:ltr}
  .addn{grid-column:2/-1;justify-self:start;background:none;border:0;color:var(--dim);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;padding:0;cursor:pointer;transition:color .3s}
  .addn:hover{color:var(--gold)}
  .tnote{grid-column:2/-1}
  .rows small{font-size:.8rem}
  .sv{inset-inline-start:3vw;bottom:calc(4.6vh + 30px);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);opacity:0;transition:opacity .5s var(--ease)}
  .sv.on{opacity:1}
  .sv::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-inline-end:.6rem;vertical-align:middle}
  .sv[data-k="err"]::before{background:#e7b27a}
  @media (max-width:860px){.sv{bottom:calc(11vh + 30px)}}
  /* chrome */
  .nav{position:fixed;z-index:10}
  /* top bar: transparent at the top, frosted glass once content scrolls under it */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:20;height:86px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 3vw;
    background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(10px) saturate(160%);backdrop-filter:blur(10px) saturate(160%);
    border-bottom:1px solid transparent;
    transition:background .5s var(--ease),border-color .5s var(--ease),-webkit-backdrop-filter .5s var(--ease),backdrop-filter .5s var(--ease)}
  .topbar.scrolled{background:rgba(8,8,10,.55);-webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);border-bottom-color:rgba(243,239,230,.1)}
  .brand{display:flex;align-items:center;gap:.85rem;min-width:0;white-space:nowrap;font-size:.78rem;letter-spacing:.42em;font-weight:400}
  .brand img{height:34px;width:34px;object-fit:contain;display:block}
  .org img{height:64px;display:block;opacity:.95}
  .tb-end{display:flex;justify-content:flex-end}
  .lang{background:none;border:1px solid rgba(201,169,110,.4);color:var(--gold);padding:.45rem 1rem;font-size:.78rem;cursor:pointer;transition:all .4s var(--ease)}
  .lang:hover{background:rgba(201,169,110,.1)}
  .count{inset-inline-start:3vw;bottom:4.6vh;font-family:var(--serif);font-style:italic;font-size:1.1rem;color:var(--gold);direction:ltr}
  .ctrl{inset-inline-end:3vw;bottom:4vh;display:flex;gap:.7rem}
  .hint{left:50%;bottom:5vh;transform:translateX(-50%);font-size:.72rem;color:var(--dim);white-space:nowrap}
  kbd{font:inherit;border:1px solid rgba(243,239,230,.2);padding:1px 7px;margin:0 2px;border-radius:4px}

  /* thanks */
  #thanks{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;text-align:center;padding:8vw;background:rgba(0,0,0,.92);opacity:0;visibility:hidden;transition:opacity .8s var(--ease),visibility 0s .8s}
  #thanks.on{opacity:1;visibility:visible;transition:opacity .8s var(--ease)}
  #thanks .ck{width:92px;height:92px;margin:0 auto 2rem;display:block}
  #thanks .ck circle{fill:none;stroke:var(--gold);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1}
  #thanks .ck path{fill:none;stroke:var(--gold-hi);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
  #thanks.on .ck circle{animation:dr 1.4s var(--ease) .2s forwards}#thanks.on .ck path{animation:dr .9s var(--ease) 1s forwards}
  @keyframes dr{to{stroke-dashoffset:0}}
  #report{display:none}

  @media (max-width:860px){
    .hero,.q,.rev,.tw{grid-template-columns:1fr;gap:2rem}
    .trow{grid-template-columns:46px 1fr 2.4rem}.mm{grid-column:1/-1;justify-content:space-between}.mm button{flex:1}
    .scr{padding:max(13vh,100px) 7vw 17vh}.hint{display:none}.brand{gap:.6rem;font-size:.7rem;letter-spacing:.28em}.brand img{height:30px;width:30px}.org img{height:52px}.topbar{height:76px}
    .art{width:min(70vw,40vh)}
    .meter{height:100px}.qnum{font-size:16rem}
    .ctrl{inset-inline:5vw;justify-content:space-between}.count{bottom:11vh}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}}

  @media print{
    @page{margin:16mm}
    html,body{overflow:visible!important;height:auto!important;background:#fff!important;color:#111!important}
    body>*:not(#report){display:none!important}
    #report{display:block!important;font-family:var(--sans);color:#111}
    #report h1{font-size:30pt;color:#111;margin:0 0 4pt}
    #report .gold{color:#8f7240}
    #report table{width:100%;border-collapse:collapse;margin:14pt 0}
    #report td,#report th{padding:7pt 6pt;border-bottom:1px solid #ccc;text-align:start;font-size:10.5pt;vertical-align:top}
    #report th{font-size:8pt;letter-spacing:.14em;text-transform:uppercase;color:#8f7240}
    #report .big{font-size:40pt;font-family:var(--serif);color:#8f7240}
    #report .sig{margin-top:40pt;display:flex;gap:40pt}#report .sig div{flex:1;border-top:1px solid #111;padding-top:5pt;font-size:9pt}
  }
</style>
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>
<div class="grid-bg" aria-hidden="true"></div><div class="grid-hi" aria-hidden="true"></div><div class="spot" aria-hidden="true"></div>
<div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="prog" id="prog"></div>

<header class="topbar" id="topbar">
  <div class="brand"><img data-logo="xA" alt=""><span>XORDEN</span></div>
  <div class="org"><img data-logo="hitL" alt="H.I.T Academy"></div>
  <div class="tb-end"><button class="lang" id="lang" type="button" aria-label="Language">العربية</button></div>
</header>
<div class="nav count" id="count"></div>
<div class="nav sv" id="sv" aria-live="polite"></div>
<div class="nav ctrl" id="ctrl" hidden><button class="btn" id="back" data-i="back">Back</button><button class="btn primary" id="next" data-i="next">Continue</button></div>
<div class="nav hint" id="hint" data-i="hint"></div>

<main id="stage">
  <!-- welcome -->
  <section class="scr active" aria-label="Welcome">
    <div class="in hero">
      <div>
        <p class="micro" style="margin-bottom:1.8rem" data-a data-i="eyebrow"></p>
        <h1 data-a style="--d:.15s"><span data-i="h1a"></span> <em data-i="h1b"></em></h1>
        <div class="rule" style="--d:.7s;max-width:20rem;margin:2.2rem 0 1.6rem"></div>
        <p class="lead" data-a style="--d:.8s" data-i="lead"></p>
        <p class="team" id="team" data-a style="--d:.95s"></p>
        <div style="margin-top:2.4rem;--d:1s" data-a><button class="btn primary" id="begin" data-i="begin"></button></div>

  });
  let ty = null;
  addEventListener('touchstart', e => ty = e.touches[0].clientX, { passive: true });
  addEventListener('touchend', e => { if (ty === null) return; const d = ty - e.changedTouches[0].clientX; if (Math.abs(d) > 70 && cur >= 1 && cur <= TM) { const f = S.lang === 'ar' ? d < 0 : d > 0; f ? (canNext() && go(cur + 1)) : go(cur - 1); } ty = null; }, { passive: true });

  /* ===== output: summary / report / data ===== */
  const dateStr = () => new Date().toLocaleDateString(S.lang === 'ar' ? 'ar-EG' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  function payload() {
    const l = T.en;
    return { project: CONFIG.project, institution: CONFIG.institution, evaluator: { name: S.name, position: S.title || L().defTitle },
      ratings: T.en.crit.map((c, i) => ({ criterion: c.t, score: S.rate[i], note: S.note[i] || '' })),
      team: TEAM.map((m, i) => ({ name: m.en, role: m.role.en, score: S.trate[i], note: S.tnote[i] || '' })), teamAverage: +fmt(tavg()), overall: +fmt(avg()), grade: l.g[gKey(avg())], comments: S.comment, language: S.lang, submittedAt: new Date().toISOString() };
  }
  function summary() {
    const l = L(), a = avg();
    return [`${CONFIG.project} — ${l.reportTitle}`, CONFIG.institution, '',
      ...l.crit.map((c, i) => `${i + 1}. ${c.t}: ${S.rate[i] || '–'}/10` + (S.note[i] ? `\n   ${S.note[i]}` : '')), '',
      `${l.overall}: ${fmt(a)}/10 — ${l.g[gKey(a)]}`, '', `${l.teamLabel}:`,
      ...TEAM.map((m, i) => `• ${m[S.lang]} (${m.role[S.lang]}): ${S.trate[i] || '–'}/10` + (S.tnote[i] ? `\n   ${S.tnote[i]}` : '')), `${l.teamScore}: ${fmt(tavg())}/10`, '',
      `${l.evaluator}: ${S.name || '—'} (${S.title || l.defTitle})`, `${l.date}: ${dateStr()}`, ...(S.comment ? ['', `${l.comments}: ${S.comment}`] : [])].join('\n');
  }
  function buildReport() {
    const l = L(), a = avg(), esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    $('#report').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16pt"><img src="${LOGO.hitO}" alt="" style="height:54pt"><img src="${LOGO.xB}" alt="" style="height:44pt;border-radius:8pt"></div><p class="gold" style="letter-spacing:.3em;font-size:9pt;margin:0 0 10pt">${esc(CONFIG.project)} · ${esc(CONFIG.institution)}</p>
      <h1>${l.reportTitle}</h1><p style="margin:0 0 14pt;color:#555">${dateStr()}</p>
      <div style="display:flex;align-items:baseline;gap:14pt"><span class="big">${fmt(a)}</span><span style="font-size:14pt;color:#555">/ 10 — ${l.g[gKey(a)]}</span></div>
      <table><thead><tr><th>${l.criterion}</th><th style="width:60pt">${l.score}</th><th>${l.notes}</th></tr></thead><tbody>
      ${l.crit.map((c, i) => `<tr><td>${esc(c.t)}</td><td>${S.rate[i] || '–'} / 10</td><td>${esc(S.note[i] || '')}</td></tr>`).join('')}</tbody></table>
      <table><thead><tr><th>${l.teamLabel}</th><th style="width:60pt">${l.score}</th><th>${l.notes}</th></tr></thead><tbody>
      ${TEAM.map((m, i) => `<tr><td>${esc(m[S.lang])}<br><span style="color:#777;font-size:9pt">${esc(m.role[S.lang])}</span></td><td>${S.trate[i] || '–'} / 10</td><td>${esc(S.tnote[i] || '')}</td></tr>`).join('')}</tbody></table>
      <p style="margin:0 0 10pt"><strong>${l.teamScore}:</strong> ${fmt(tavg())} / 10</p>
      ${S.comment ? `<p><strong>${l.comments}:</strong> ${esc(S.comment)}</p>` : ''}
      <p><strong>${l.evaluator}:</strong> ${esc(S.name || '—')} — ${esc(S.title || l.defTitle)}</p>
      <div class="sig"><div>${l.signature}</div><div>${l.stamp}</div></div>`;
  }
  const printPDF = () => { buildReport(); setTimeout(() => print(), 60); };
  const flash = (btn, txt) => { const o = btn.textContent; btn.textContent = txt; setTimeout(() => btn.textContent = o, 1400); };
  $('#b-pdf').addEventListener('click', printPDF); $('#th-pdf').addEventListener('click', printPDF);
  $('#b-mail').addEventListener('click', () => { location.href = `mailto:${CONFIG.teamEmail}?subject=${encodeURIComponent(CONFIG.project + ' — ' + L().reportTitle)}&body=${encodeURIComponent(summary())}`; });
  const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
  const sbOn = () => !!(CONFIG.supabase && CONFIG.supabase.url && CONFIG.supabase.anonKey);
  const hasData = () => S.rate.some(Boolean) || S.trate.some(Boolean) || S.note.some(Boolean) || S.tnote.some(Boolean) || !!S.name || !!S.comment;
  function dbRow(status) {
    const a = avg(), en = T.en, any = S.rate.some(Boolean);
    return {
      id: S.sid, status,
      evaluator_name: S.name || null, evaluator_position: S.title || null, language: S.lang,
      overall: any ? +fmt(a) : null, grade: any ? en.g[gKey(a)] : null, team_average: S.trate.some(Boolean) ? +fmt(tavg()) : null, comments: S.comment || null,
      ratings: en.crit.map((c, i) => ({ part: i + 1, criterion: c.t, score: S.rate[i] || null, note: S.note[i] || '' })),
      team: TEAM.map((m, i) => ({ name: m.en, name_ar: m.ar, role: m.role.en, score: S.trate[i] || null, note: S.tnote[i] || '' })),
      user_agent: navigator.userAgent.slice(0, 300)
    };
  }
  let chain = Promise.resolve();
  const enqueue = fn => (chain = chain.then(fn, fn));
  async function pushRemote(status) {
    const sb = CONFIG.supabase;
    if (!S.sid) { S.sid = uuid(); persistLocal(); }
    const r = await fetch(sb.url.replace(/\/+$/, '') + '/rest/v1/rpc/save_evaluation', {
      method: 'POST',
      headers: { apikey: sb.anonKey, Authorization: 'Bearer ' + sb.anonKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p: dbRow(status) }), keepalive: status === 'draft'
    });
    if (!r.ok) { console.warn('Supabase error', r.status, await r.text().catch(() => '')); throw new Error('supabase ' + r.status); }
  }
  let svT = 0, rt = 0;
  function showSv(k) {
    const el = $('#sv'); if (!el) return; clearTimeout(svT);
    el.textContent = L()[k === 'busy' ? 'svBusy' : k === 'ok' ? 'svOk' : 'svErr']; el.dataset.k = k; el.classList.add('on');
    if (k !== 'busy') svT = setTimeout(() => el.classList.remove('on'), 2200);
  }
  function scheduleRemote() {            // every change is sent to Supabase shortly after it happens
    if (!sbOn() || !hasData()) return;
    clearTimeout(rt); showSv('busy');
    rt = setTimeout(() => enqueue(() => pushRemote('draft')).then(() => showSv('ok'), () => showSv('err')), 900);
  }
  let sending = false;
  $('#b-submit').addEventListener('click', async e => {
    if (sending) return;
    if (!complete()) { $('#warn').textContent = L().unrated; return; }
    sending = true; const btn = e.currentTarget; btn.disabled = true;
    S.submitted = new Date().toISOString(); persistLocal();
    let res = 'local';
    try {
      if (sbOn()) { clearTimeout(rt); await enqueue(() => pushRemote('submitted')); S.sid = null; persistLocal(); res = 'ok'; }
      else if (CONFIG.submitEndpoint) {
        const r = await fetch(CONFIG.submitEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(payload()) });
        res = r.ok ? 'ok' : 'fail';
      }
    } catch (x) { console.warn(x); res = 'fail'; }
    const l = L(); $('#th-m').textContent = res === 'ok' ? l.sentOk : res === 'fail' ? l.sentFail : l.savedOnly;
    $('#thanks').classList.add('on'); sending = false; btn.disabled = false;
  });
  $('#th-close').addEventListener('click', () => $('#thanks').classList.remove('on'));

  /* ===== pointer light + dust ===== */
  const root = document.documentElement;
  addEventListener('pointermove', e => { root.style.setProperty('--mx', e.clientX + 'px'); root.style.setProperty('--my', e.clientY + 'px'); root.style.setProperty('--nx', (e.clientX / innerWidth - .5).toFixed(3)); root.style.setProperty('--ny', (e.clientY / innerHeight - .5).toFixed(3)); });
  if (!RM) {
    const c = $('#dust'), x = c.getContext('2d'), dp = Math.min(devicePixelRatio || 1, 2); let W, H; const P = [];
    const size = () => { W = c.width = innerWidth * dp; H = c.height = innerHeight * dp; }; size(); addEventListener('resize', size);
    for (let i = 0; i < 60; i++) P.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + .3, vx: (Math.random() - .5) * .00004, vy: -Math.random() * .00006 - .00002, a: Math.random() * .5 + .15, t: Math.random() * 6 });
    (function f() { x.clearRect(0, 0, W, H); for (const p of P) { p.x += p.vx; p.y += p.vy; p.t += .02; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); } if (p.x < 0) p.x = 1; if (p.x > 1) p.x = 0;
      x.beginPath(); x.arc(p.x * W, p.y * H, p.r * dp, 0, 6.283); x.fillStyle = `rgba(224,196,140,${p.a * (.6 + .4 * Math.sin(p.t))})`; x.fill(); } requestAnimationFrame(f); })();
  }

  /* ===== boot ===== */
  $$('[data-logo]').forEach(i => i.src = LOGO[i.dataset.logo === 'hitL' ? 'hitL' : 'xA']);
  applyLang();
  cur = 0; scr.forEach((s, i) => { if (i) { s.classList.add('after'); } });
  setTimeout(render, 120);
})();
</script>
</body>
